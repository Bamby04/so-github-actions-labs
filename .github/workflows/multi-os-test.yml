name: Multi-OS System Check

on:
  push:
  pull_request:

jobs:
  check_system:
    name: System Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show system information (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Operating System: ${{ matrix.os }}"
          echo "Runner name: ${{ runner.name }}"
          echo "CPU Info:"
          uname -a

      - name: Show system information (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Operating System: ${{ matrix.os }}"
          echo "Runner name: ${{ runner.name }}"
          echo "CPU Info:"
          systeminfo

      - name: List current directory (Linux/macOS)
        if: runner.os != 'Windows'
        run: ls -la

      - name: List current directory (Windows)
        if: runner.os == 'Windows'
        run: dir
